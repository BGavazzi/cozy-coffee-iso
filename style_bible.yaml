# Style bible - the human-facing control surface for the whole pipeline.
#
# Everything downstream reads this file. Creative direction edits it; nothing
# else. See PIPELINE.md section 7.

art_direction:
  target: >-
    Studio Ghibli colour sensibility expressed through 16-bit pixel art
    constraints. Not soft-rendered Ghibli - Ghibli's *colour science* filtered
    through a locked palette and hard pixel edges.

  precedent: >-
    SNES-era JRPG backgrounds (Secret of Mana, Terranigma, Illusion of Gaia)
    already solved this. They borrowed Ghibli's palette and light handling
    directly while staying strictly within pixel-art constraints. That is the
    reference point, not the diffusion "Ghibli filter" look.

  # What we take from Ghibli, and what we deliberately do not.
  adopt:
    - warm light / cool shadow hue shifting (the single most defining rule)
    - high-key value distribution; most of the frame sits in the upper mids
    - modest chroma, peaking in mid-tones, never neon
    - verdant greens, warm creams, sky blues, warm woods, muted terracotta
    - almost never pure black or pure white
  reject:
    - soft airbrushed gradients      # destroyed by palette quantization
    - diffuse edge falloff           # incompatible with 1-bit alpha
    - painterly texture noise        # becomes dither mud at 64px
  substitute:
    gradients: ordered dithering between adjacent ramp steps
    soft_edges: selective coloured outline, tinted per surface
    atmosphere: value compression toward the ramp's light end, not blur

# --- Palette ----------------------------------------------------------------
# Ramps are generated in OKLab by tools/palette_forge.py, not hand-picked, so
# perceptual spacing is provable rather than eyeballed.

palette:
  total_colours: 40
  min_delta_e: 0.035          # below this two entries collapse under quantization

  # Painterly hue-shift anchors. Shadows bend toward the cool anchor, highlights
  # toward the warm one. This is what reads as "Ghibli" more than any hue choice.
  hue_shift:
    cool_anchor: 275          # violet-blue
    warm_anchor: 85           # warm yellow
    cool_amount: 0.24
    warm_amount: 0.22

  chroma_falloff: 0.26        # aggressive falloff makes all warm ramps converge at the light end

  ramps:
    # One wood ramp, not two. Two warm ramps 15deg apart with overlapping
    # lightness always collide under quantization - the forge caught it.
    # Also the skin ramp - wood_3..wood_6 are textbook flesh tones. Wood and
    # skin are genuinely the same hue family, and at 40 colours the palette
    # cannot afford to pretend otherwise: three separate warm ramps plus cream
    # will not pack into a high-key, low-chroma gamut. The forge proved this
    # across several attempts before the structure was changed.
    wood:        { hue: 50,  steps: 7, lightness: [0.30, 0.90], chroma: 0.085 }
    cream:       { hue: 85,  steps: 5, lightness: [0.72, 0.97], chroma: 0.040 }
    # Ghibli greens are yellow-leaning and luminous, not teal. Floor kept off
    # the very bottom so the dark end does not clip to a saturated pine.
    foliage:     { hue: 150, steps: 6, lightness: [0.42, 0.88], chroma: 0.080 }
    sky:         { hue: 235, steps: 7, lightness: [0.46, 0.94], chroma: 0.070 }
    # Fabric, awnings, cushions, cups. cool_amount near zero: bending red
    # toward violet gives plum, which reads as bruising wherever it touches
    # skin-adjacent surfaces.
    rose:        { hue: 14,  steps: 6, lightness: [0.50, 0.86], chroma: 0.115,
                   cool_amount: 0.06 }
    neutral:     { hue: 285, steps: 6, lightness: [0.26, 0.82], chroma: 0.022 }

  # Spot colours outside the ramp system.
  spot:
    lamp_glow:     { hue: 90,  lightness: 0.935, chroma: 0.150 } # must out-glow any wood highlight
    accent_read:   { hue: 15,  lightness: 0.62, chroma: 0.145 }  # UI / interactable
    gold_coin:     { hue: 95,  lightness: 0.780, chroma: 0.160 } # currency, UI positive

  # --- Time-of-day variants -------------------------------------------------
  # Each variant is a set of TRANSFORMS on the generator's parameters, never a
  # list of colours. That is the whole reason the base palette is computed
  # rather than picked: a second palette costs six numbers instead of forty
  # re-argued decisions.
  #
  # `lightness` is a SHIFT and a SQUEEZE about each ramp's own midpoint, not a
  # delta on its two ends. The obvious form is wrong and only shows it once the
  # palette is validated: `cream` spans 0.25 of lightness and `wood` spans 0.60,
  # so the same absolute delta compresses cream by 44% and wood by 18%, and
  # cream's steps land on top of wood's. All four first drafts were rejected on
  # exactly that collision.
  #
  # The strengths below were SWEPT, not chosen. Each variant has a direction,
  # and the sweep reports the strongest setting that still satisfies every
  # constraint; these sit one step inside it. `evening` and `overcast` never
  # broke and run at full strength. `golden_hour` and `night` are bounded by
  # `max_lightness` and `min_lightness` -- the "almost never pure black or pure
  # white" rule -- at 0.47 and 0.57 respectively, and ship at 0.42 and 0.52.
  variants:
    # Strengths are set so that every PAIR of shipped palettes is at least
    # min_delta_e apart on average -- the same 0.035 this palette uses to decide
    # two colours are different colours. An earlier set was swept to maximise
    # each variant's own internal min_delta_e, which is the wrong objective (a
    # variant is never quantized against, see palette_forge.validate_variant)
    # and it converged evening and night onto the same point: 0.0057 apart,
    # a sixth of the floor. They rendered as one palette shipped twice.
    # `palette_forge.check_separation` now gates that.
    golden_hour:
      note: late afternoon, the hour the genre is actually about
      # Lightness barely moves because the base palette's top ramp sits near
      # max_lightness already -- pushing it up clips to white. So this variant
      # earns its separation from chroma and hue instead, which is also what
      # low sun actually does: not brighter, oranger and more saturated.
      lightness: {shift: 0.018, squeeze: {mul: 0.97}}
      chroma: {mul: 1.55}
      hue_shift: {warm_amount: {mul: 2.10}, cool_amount: {mul: 0.60}}

    evening:
      note: after sunset, before the lamps carry the room
      lightness: {shift: -0.105, squeeze: {mul: 0.92}}
      chroma: {mul: 0.72}
      hue_shift: {cool_amount: {mul: 1.85}, warm_amount: {mul: 0.60}}

    night:
      note: >-
        lamps carry the room. The ramps drop and compress; the spot colours do
        NOT follow them down, because a lamp that dims with the room it is
        lighting is the one thing that would read as wrong.
      # squeeze 0.68 is heavier than the others on purpose. Shifting this far
      # down alone puts the darkest ramp at L 0.087, well under min_lightness
      # 0.15, so the squeeze is what buys the room to be this dark at all --
      # it lands the floor at 0.165 with margin rather than on the boundary.
      # The flattened contrast is not a cost here: losing shading separation in
      # the dark is what low light does to vision.
      lightness: {shift: -0.185, squeeze: {mul: 0.68}}
      chroma: {mul: 0.55}
      hue_shift: {cool_amount: {mul: 2.30}, warm_amount: {mul: 0.42}}
      spot_lightness: {add: 0.030}

    overcast:
      note: rain on the window, the low-chroma variant
      # The only variant where chroma does nearly all the work. Flat daylight
      # is not much darker than sun, it is much greyer, so a big lightness
      # shift here would read as dusk instead of as weather.
      lightness: {shift: -0.045, squeeze: {mul: 0.88}}
      chroma: {mul: 0.38}
      hue_shift: {cool_amount: {mul: 1.50}, warm_amount: {mul: 0.55}}

  constraints:
    no_pure_black: true
    no_pure_white: true
    min_lightness: 0.15
    max_lightness: 0.99
    outline_source: neutral   # outline colour comes from the neutral ramp, never #000
    # The warm-highlight/cool-shadow rule `palette_forge.validate` enforces as a
    # hard pass/fail is this style's defining choice, not a property every
    # style must share -- a style that isn't chasing the Ghibli look at all
    # (flat, hardware-flavoured, no hue-bend) needs to be able to say so
    # instead of failing validation for not being this style. Left true here
    # because it is exactly what this style is.
    require_warm_cool_shift: true

# --- Material roles ----------------------------------------------------------
# The semantic vocabulary tools/assetlib.py's prop builders and tools/character.py
# author against -- what "the wood of a chair" or "a window pane" IS, not which
# ramp happens to carry it in this palette. Every style pack must declare all
# of these; a missing one means a prop or figure silently reads through whatever
# ramp a stale default points at, which is a wrong-looking room, not an error.
# Values are material tokens as tools/pixelize.material() parses them: a ramp
# name from `palette.ramps` above, optionally with a `+N`/`-N` tone offset.
materials:
  wood: wood
  ceramic: cream
  plant: foliage
  fabric: rose
  metal: neutral
  # Glass is the sky ramp read HIGH, not at its middle -- mid-lightness sky over
  # a whole pane is a saturated blue slab, which review called "windows that do
  # not look like glass". Real glass sits near the value of what is behind it,
  # with colour arriving only at the edges.
  glass: sky+2
  glass_edge: sky
  # Two steps down from plain cream -- at full cream the far wall measured the
  # brightest thing in frame by a wide margin, pulling the eye off the room.
  wall_field: cream-2
  # One step down from bare wood -- not a colour choice, a value choice, so the
  # floor is the quietest surface everything else is measured up from.
  floor_field: wood-1
  # tools/tileset.py's wall skirting/chair-rail/batten (PR #38). `wood-1` and
  # `wood-2` are the literal tokens `wall_panel()`/`wall_plain()` hardcoded
  # before this pack's own `materials:` was wired to supply them -- unchanged
  # here, since this style's own check_collapse already passed against these
  # exact values (verified byte-identical after the change, not just assumed).
  wall_trim: wood-1
  wall_trim_shadow: wood-2

# --- Character rig -------------------------------------------------------
# tools/character.py's proportions, recorded as data. NOT YET CONSUMED by
# character.py -- the module still reads these as its own hardcoded module
# constants, with the values below kept identical on purpose so the two never
# drift out of sync until the promotion lands (see NEXT.md, "style packs").
# A style that wants a rounder, less faceted figure declares `primitive:
# cylinder_sphere` here; `character.py` still only knows `box_prism`.
rig:
  primitive: box_prism
  height: 1.59
  torso_rx: 0.250
  torso_ry: 0.210
  head_rx: 0.205
  head_ry: 0.185
  head_z: 1.00
  hip_z: 0.46
  shoulder_z: 0.92
  ankle_z: 0.10
  seat_z: 0.45
  max_seat_z: 0.58
  perch_leg: 0.52
  max_perch_z: 0.85
  sprite_target_px: 46
  portrait_target_px: 128

# --- Check-threshold overrides ------------------------------------------
# Empty on purpose. These floors (see tools/character.py, tools/art_review.py)
# were each set from a real measurement run against THIS rig and THIS palette
# -- see their docstrings for the run that set them. A different style earns
# its own overrides the same way, from a real render, not a guess made ahead
# of having one.
checks: {}

# --- Rendering conventions --------------------------------------------------

rendering:
  outline:
    mode: selective           # not a uniform 1px keyline around everything
    tint: true                # outline hue borrows from the surface it bounds
    pure_black: false
  dithering:
    enabled: true
    pattern: ordered_4x4
    scope: adjacent_ramp_steps_only   # never dither across ramp families
  shading:
    ramp_steps_visible: true  # flat banding is the goal, not a defect
    smooth_gradients: false

# --- Resolved project decisions ---------------------------------------------

decisions:
  room_scale:
    value: single_fixed_room
    detail: 14 x 10 tiles, camera locked, no scrolling
    rationale: >-
      Agreed by both parties. Bounds the tile budget at ~40 and keeps the
      furniture-rearrangement loop (the actual game) tile-based.
  projection:
    value: dimetric_2to1
    detail: camera elevation 30deg (Blender RotX=60), RotZ=45+k*45
  directions:
    value: CONTESTED
    detail: see README - 8 (project direction) vs 4 (Rafael). Blocking.
  human_cleanup:
    value: CONTESTED
    detail: see README - excluded (project direction) vs acceptable (Rafael). Blocking.
